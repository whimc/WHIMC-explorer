version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /web
    schedule:
      interval: weekly
    # Keep receiving 5.2 LTS patches; review a framework upgrade separately.
    ignore:
      - dependency-name: django
        versions: [">=5.3"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /plugin
    schedule:
      interval: weekly
