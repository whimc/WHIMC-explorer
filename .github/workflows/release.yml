name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python tools/version.py check
          if [ -n "$RELEASE_TAG" ]; then python tools/version.py check --tag "$RELEASE_TAG"; fi
      - name: Python tests
        env:
          EXPLORER_MODE: demo
        run: |
          python -m pip install -r web/requirements.txt -r tools/requirements.txt
          python web/manage.py test portal
          python web/manage.py makemigrations --check --dry-run
          python -m unittest discover -s tools -p 'test_*.py'
      - name: JavaScript syntax
        run: |
          node --check web/portal/static/portal/explorer.js
          node --check web/portal/static/portal/compare.js
      - name: Build both Minecraft targets
        run: |
          mvn -B -f plugin/pom.xml package
          mvn -B -f plugin/pom.xml -Pmc-1.21.11 package
          python tools/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist
      - name: Publish tested pilot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "WHIMC Explorer $RELEASE_TAG" --notes "Pilot release. Install only the JAR matching your Minecraft version. For the web update, back up the private database, upload the web ZIP contents, run migrate and collectstatic, then restart Passenger. Read docs/RELEASES.md and docs/COMPATIBILITY.md before installation. Live 1.21.11 integration testing remains outstanding." --generate-notes
